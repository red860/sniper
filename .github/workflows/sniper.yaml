name: One Piece TCG Sniper

on:
  schedule:
    # Runs at :00 and :30 between 08:00 and 21:30 UTC every day
    - cron: '0,30 8-21 * * *'
  workflow_dispatch:
    inputs:
      test_mode:
        description: 'Send a test notification to my phone right now?'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

permissions:
  contents: write

jobs:
  check_stock:
    runs-on: ubuntu-24.04
    timeout-minutes: 32
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install Chrome TLS impersonator
        run: pip install curl_cffi

      - name: Run stock monitor (25-minute loop)
        env:
          TEST_MODE: ${{ github.event.inputs.test_mode }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python monitor.py

      - name: Commit updated stock state
        run: |
          git config user.name "stock-bot"
          git config user.email "stock-bot@users.noreply.github.com"
          
          # Heartbeat keep-alive so GitHub never sleeps the repo
          if [ "$(date +%d)" = "01" ] && [ "$(date +%H)" = "08" ]; then
            date -u > .heartbeat
            git add .heartbeat
          fi
          
          git add state.json
          git diff --staged --quiet || (git commit -m "Update stock state [skip ci]" && git push)