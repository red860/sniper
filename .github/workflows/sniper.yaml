name: One Piece TCG Sniper

on:
  workflow_dispatch:
    inputs:
      test_mode:
        description: 'Send a test notification to my phone right now?'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

concurrency:
  group: tcg-sniper-queue
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check_stock:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install Chrome TLS impersonator
        run: pip install curl_cffi

      - name: Pull latest state right before scanning
        run: git pull --rebase origin main || true

      - name: Run stock monitor (28-minute loop)
        env:
          TEST_MODE: ${{ github.event.inputs.test_mode }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python monitor.py

      - name: Commit updated stock state
        run: |
          git config user.name "stock-bot"
          git config user.email "stock-bot@users.noreply.github.com"
          git add state.json
          git diff --staged --quiet || (git commit -m "Update stock state [skip ci]" && git pull --rebase origin main && git push)